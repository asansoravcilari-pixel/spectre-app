name: Build Spectre APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python Ortamını Hazırla ve Pillow (PIL) Kur
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Android Platform ve Araçlarını Yükle
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Sunucu Onay Testleri
        run: |
          if [ -d "tests" ]; then
            python3 -m unittest discover -s tests -v
          else
            echo "Test klasörü bulunamadı, atlanıyor."
          fi

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK Derle ve Hata Ayıkla
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: APK Dosyasını Yayınla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRE-Central-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
