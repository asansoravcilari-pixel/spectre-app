name: Build APK

on:
  push:
    branches: [ "main", "ana" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android Altyapisini Kur
        run: |
          flutter create . --project-name=spectre_app --platforms=android --org=com.spectre.app --overwrite
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Mobile-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
