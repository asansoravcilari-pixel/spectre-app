name: Build Spectre Central APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android Lisanslarını Onayla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Dizin Yapısını Kontrol Et ve APK Derle
        run: |
          # Eğer kodlar bir alt klasördeyse oraya geç
          if [ -d "spectre-central" ]; then
            cd spectre-central
          fi

          chmod +x gradlew || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --info
          else
            gradle assembleDebug --no-daemon --info
          fi

      - name: Debug APK Yayınla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRE-Central-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
          if-no-files-found: error
