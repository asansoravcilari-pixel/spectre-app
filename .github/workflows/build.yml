name: Build Spectre Central APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android Lisanslarını Onayla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Python Onay Testleri
        run: |
          if [ -d "tests" ]; then
            python3 -m unittest discover -s tests -v || true
          fi

      - name: Gradle ile APK Derle
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Debug APK Yayınla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRE-Central-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
