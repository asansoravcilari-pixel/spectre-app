name: Build APK

on:
  push:
    branches: [ "main", "ana" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android Altyapisi ve Ikon Uretimi
        run: |
          # Yalnizca android klasoru yoksa olustur, main.dart ve mevcut dosyalari asla silme
          if [ ! -d "android" ]; then
            flutter create . --project-name=spectre_app --platforms=android --org=com.spectre.app
          fi

          # Ozel SPECTRE Neon AI Uygulama Ikonu Uret
          python3 -c '
          import os
          from PIL import Image, ImageDraw

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          res_dir = "android/app/src/main/res"
          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              img = Image.new("RGBA", (size, size), (15, 21, 39, 255))
              draw = ImageDraw.Draw(img)
              margin = int(size * 0.1)
              draw.ellipse([margin, margin, size - margin, size - margin], outline=(108, 92, 231, 255), width=max(2, int(size * 0.05)))
              inner_margin = int(size * 0.3)
              draw.ellipse([inner_margin, inner_margin, size - inner_margin, size - inner_margin], fill=(162, 155, 254, 255))
              img.save(os.path.join(target_dir, "ic_launcher.png"))
          '

          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Mobile-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
