name: Build Spectre Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter Ortamını Hazırla
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları Kur ve APK Derle
        run: |
          # pubspec.yaml neredeyse oraya geç
          PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Flutter kök dizini: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi

          flutter pub get
          flutter build apk --debug

      - name: APK Dosyasını Çıktı Olarak Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRE-Mobile-debug-APK
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
